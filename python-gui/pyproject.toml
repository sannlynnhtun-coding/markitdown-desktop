[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-gui"
version = "0.1.0"
description = "A focused desktop companion for converting files with MarkItDown"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["markitdown>=0.1"]

[project.gui-scripts]
markitdown-gui = "markitdown_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_gui"]

[tool.hatch.build.targets.sdist]
include = ["src/markitdown_gui", "tests", "README.md"]
