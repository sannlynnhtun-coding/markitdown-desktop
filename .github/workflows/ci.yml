name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test Python desktop app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            "markitdown @ git+https://github.com/microsoft/markitdown.git@cc0ca9edd8e23b2c7f7b778c7b148c1565730498#subdirectory=packages/markitdown"
          python -m pip install --disable-pip-version-check --no-deps .\python-gui

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .\python-gui\src).Path
          python -m unittest discover -s .\python-gui\tests -v

  package:
    name: Build and publish Windows installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            '0.1.0'
          }
          .\python-gui\installer\build-installer.ps1 -Version $version

          $releaseRoot = New-Item -ItemType Directory -Force .\artifacts\release
          $built = ".\python-gui\artifacts\MarkItDown-Setup-$version-win-x64.exe"
          $installer = Join-Path $releaseRoot 'MarkItDownDesktop-Setup-x64.exe'
          Copy-Item -LiteralPath $built -Destination $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MarkItDownDesktop-Setup-x64.exe" |
            Set-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-Desktop-${{ github.ref_name }}-unsigned
          path: |
            artifacts/release/MarkItDownDesktop-Setup-x64.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Replace GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @'
          A self-contained Windows desktop interface powered by Microsoft MarkItDown.

          ## Highlights

          - Queue files or folders and use the visible **Convert all** action.
          - Follow batch percentage, per-file status, step-by-step logs, and elapsed time.
          - Switch between light and dark modes.
          - Right-click completed files to open their Markdown output.
          - Right-click selected rows to remove them from the queue without deleting files.
          - Uses the MarkItDown app icon in the installer, executable, taskbar, and window title bar.

          ## Download

          - **MarkItDownDesktop-Setup-x64.exe** — recommended self-contained Windows x64 installer.
          - **SHA256SUMS.txt** — SHA-256 checksum for the installer.

          End users do not need Python, pip, or a command line. Conversion runs locally.

          > [!WARNING]
          > The installer is unsigned, so Windows may show a SmartScreen warning.
          '@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            foreach ($asset in $assets) {
              gh release delete-asset $tag $asset --repo $env:GITHUB_REPOSITORY --yes
            }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY `
              --title "MarkItDown Desktop $tag" --notes $notes --latest
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag `
              --title "MarkItDown Desktop $tag" --notes $notes --latest
          }

          gh release upload $tag `
            .\artifacts\release\MarkItDownDesktop-Setup-x64.exe `
            .\artifacts\release\SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --clobber
