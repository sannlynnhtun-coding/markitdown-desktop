name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: microsoft/setup-msbuild@v2

      - name: Install runtime build tool
        run: python -m pip install uv

      - name: Build pinned Python runtime
        shell: pwsh
        run: .\build\Build-PythonRuntime.ps1

      - name: Run automated tests and Windows build
        shell: pwsh
        run: .\build\Test.ps1 -Configuration Release

  package:
    name: Build unsigned offline installers
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: microsoft/setup-msbuild@v2

      - name: Install runtime build tool
        run: python -m pip install uv

      - name: Build installers
        shell: pwsh
        run: .\build\Build-Release.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-Desktop-${{ github.ref_name }}-unsigned
          path: |
            artifacts/installer/MarkItDownDesktop-Setup-x64.exe
            artifacts/installer/MarkItDownDesktop-x64.msi
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @'
          First Windows x64 release of MarkItDown Desktop, an independent community GUI powered by Microsoft MarkItDown.

          ## Download

          - **MarkItDownDesktop-Setup-x64.exe** — recommended offline installer; includes the WebView2 prerequisite.
          - **MarkItDownDesktop-x64.msi** — enterprise deployment package; requires WebView2 to be installed first.
          - **SHA256SUMS.txt** — SHA-256 checksums for both installers.

          End users do not need Python, pip, the .NET runtime, or a command line. Conversion runs locally and telemetry is not collected.

          > [!WARNING]
          > These initial installers are unsigned. Windows may show a SmartScreen warning. A trusted Authenticode certificate is required before broad public distribution.
          '@
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            'artifacts/installer/MarkItDownDesktop-Setup-x64.exe',
            'artifacts/installer/MarkItDownDesktop-x64.msi',
            'artifacts/installer/SHA256SUMS.txt',
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', "MarkItDown Desktop $env:GITHUB_REF_NAME",
            '--notes', $releaseNotes,
            '--latest'
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
