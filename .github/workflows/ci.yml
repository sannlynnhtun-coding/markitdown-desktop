name: Rust desktop CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check Rust desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path rust-desktop/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path rust-desktop/Cargo.toml --no-default-features
      - name: Desktop Clippy
        run: cargo clippy --locked --manifest-path rust-desktop/Cargo.toml --all-targets -- -D warnings

  package:
    name: Build Rust Windows installer artifact
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare PDF and OCR runtime
        shell: pwsh
        run: .\rust-desktop\scripts\prepare-runtime.ps1 -RuntimeDirectory "$env:RUNNER_TEMP\markitdown-runtime"
      - name: Test native PDF and Myanmar OCR
        shell: pwsh
        run: |
          $env:MARKITDOWN_RUNTIME = "$env:RUNNER_TEMP\markitdown-runtime"
          $env:MARKITDOWN_MYANMAR_TEST_IMAGE = .\rust-desktop\tests\make-myanmar-fixture.ps1 -Output "$env:RUNNER_TEMP\myanmar.png"
          cargo test --locked --manifest-path rust-desktop/Cargo.toml --no-default-features --test pdf_pipeline -- --ignored
      - name: Build installer
        shell: pwsh
        run: .\rust-desktop\scripts\build.ps1 -Mode release -Installer -RuntimeDirectory "$env:RUNNER_TEMP\markitdown-runtime" -DistributionDirectory "$env:RUNNER_TEMP\markitdown-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-${{ github.ref_name }}-windows-x64
          path: |
            ${{ runner.temp }}/markitdown-dist/installer/MarkItDown-Setup-x64.exe
            ${{ runner.temp }}/markitdown-dist/installer/MarkItDown-Setup-x64.exe.sha256
          if-no-files-found: error
